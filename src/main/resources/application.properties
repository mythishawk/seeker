spring.application.name=seeker

# The schema comes only from Flyway (db/migration). Hibernate just checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# No Spring Batch jobs yet.
spring.batch.job.enabled=false

# Stage 2: job discovery (reads the watchlist in company_source every few hours).
seeker.discovery.enabled=true
seeker.discovery.interval=PT6H
seeker.discovery.initial-delay=PT1M
seeker.discovery.delay-between-companies=PT1S
seeker.discovery.request-timeout=PT30S
seeker.discovery.user-agent=seeker-job-agent/0.1 (personal job search)
seeker.discovery.greenhouse-base-url=https://boards-api.greenhouse.io
seeker.discovery.lever-base-url=https://api.lever.co
seeker.discovery.lever-eu-base-url=https://api.eu.lever.co

# REST API login (HTTP Basic). Set SEEKER_API_PASSWORD, or leave it empty to get a random password in the startup log.
seeker.security.username=seeker
seeker.security.password=${SEEKER_API_PASSWORD:}
